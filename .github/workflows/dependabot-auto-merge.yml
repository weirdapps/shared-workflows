name: Reusable Dependabot Auto-merge

# Reusable Dependabot auto-merge: classify the update -> wait for the caller's
# own checks -> squash-merge. Callers MUST declare write permissions (a reusable
# cannot escalate beyond the caller's grant).
#
# Why this does not just call `gh pr merge --auto`:
# GitHub's native auto-merge requires BOTH `allow_auto_merge` on the repo AND a
# branch-protection rule to gate on. Neither is available here: branch protection
# on a private repo is a paid feature on this plan, and PATCHing
# `allow_auto_merge=true` on a private repo silently no-ops. So `--auto` fails with
# "Auto merge is not allowed for this repository" (allow_auto_merge off) or
# "Protected branch rules not configured for this branch" (no protection rule),
# and every patch/minor Dependabot PR silently piles up forever.
#
# This workflow therefore tries `--auto` first (correct and cheapest where it does
# work, i.e. a public repo with protection configured) and otherwise falls back to
# polling the PR's checks itself and merging once they are green. The poll excludes
# the caller workflow's OWN checks, which would otherwise deadlock: this job is
# itself a check on the same PR, so waiting for "all checks" would wait for itself.
#
# Command inputs run via env vars (bash -c "$VAR"), never interpolated into run.

on:
  workflow_call:
    inputs:
      allow_minor:
        description: "Auto-merge semver-minor updates"
        required: false
        type: boolean
        default: true
      allow_grouped:
        description: "Auto-merge grouped updates"
        required: false
        type: boolean
        default: true
      allow_major_in_group:
        description: >-
          Auto-merge a grouped update whose aggregate level is semver-major.
          Set false for the stricter policy "a major is never auto-merged, not
          even inside a group". Only consulted when allow_grouped is true.
        required: false
        type: boolean
        default: true
      exclude_branch_prefixes:
        description: >-
          Whitespace-separated head-branch prefixes to skip, e.g.
          "dependabot/pip/". Use for ecosystems whose Dependabot PRs edit a
          DERIVED lockfile and would desync the real source of truth.
        required: false
        type: string
        default: ""
      checks_timeout_minutes:
        description: "How long to wait for the caller's checks before giving up"
        required: false
        type: number
        default: 45
      merge_method:
        description: "squash | merge | rebase"
        required: false
        type: string
        default: "squash"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 60
    steps:
      # dependabot/fetch-metadata v3.1.0
      - name: Get Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify update
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_GROUP: ${{ steps.meta.outputs.dependency-group }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ALLOW_MINOR: ${{ inputs.allow_minor }}
          ALLOW_GROUPED: ${{ inputs.allow_grouped }}
          ALLOW_MAJOR_IN_GROUP: ${{ inputs.allow_major_in_group }}
          EXCLUDE_PREFIXES: ${{ inputs.exclude_branch_prefixes }}
        run: |
          set -euo pipefail

          for prefix in $EXCLUDE_PREFIXES; do
            case "$HEAD_REF" in
              "$prefix"*)
                echo "merge=false" >>"$GITHUB_OUTPUT"
                echo "Skipping: head ref '$HEAD_REF' matches excluded prefix '$prefix'."
                exit 0
                ;;
            esac
          done

          merge=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch)
              merge=true
              ;;
            version-update:semver-minor|version-update:semver-patchminor)
              if [ "$ALLOW_MINOR" = "true" ]; then merge=true; fi
              ;;
          esac

          # A grouped update is gated separately: its aggregate level can be
          # major, and some repos want "never auto-merge a major, not even in a
          # group" while still auto-merging safe groups. This block is the sole
          # decider for grouped PRs, so it can both grant and revoke.
          if [ -n "$DEP_GROUP" ]; then
            if [ "$ALLOW_GROUPED" != "true" ]; then
              merge=false
            elif [ "$UPDATE_TYPE" = "version-update:semver-major" ] \
                 && [ "$ALLOW_MAJOR_IN_GROUP" != "true" ]; then
              merge=false
            else
              merge=true
            fi
          fi

          echo "merge=$merge" >>"$GITHUB_OUTPUT"
          echo "update-type='$UPDATE_TYPE' group='$DEP_GROUP' ref='$HEAD_REF' -> merge=$merge"
          if [ "$merge" != "true" ]; then
            echo "Major or excluded update. Leaving open for manual review." >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Merge when green
        if: steps.decide.outputs.merge == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_WORKFLOW: ${{ github.workflow }}
          TIMEOUT_MINUTES: ${{ inputs.checks_timeout_minutes }}
          MERGE_METHOD: ${{ inputs.merge_method }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MAX_API_FAILURES: "5"
        run: |
          set -euo pipefail

          state=$(gh pr view "$PR_URL" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR is $state already, nothing to do."
            exit 0
          fi

          # Fast path: native auto-merge, but ONLY when the base branch actually
          # declares required status checks.
          #
          # The header's claim that --auto "requires a branch-protection rule" is
          # true of the API call, not of the outcome. On a repo with
          # allow_auto_merge=true and NO required checks, --auto is accepted and
          # merges IMMEDIATELY, which silently bypasses this entire job. That is
          # not theoretical: resume PR #147 was queued at 14:26:59 and landed at
          # 14:26:57, 43 seconds before its own CodeQL run went red, leaving a
          # broken codeql-action version split on the default branch.
          #
          # So gate the fast path on the thing that actually makes it safe.
          if gh api "repos/$GH_REPO/branches/$BASE_REF/protection/required_status_checks" \
               >/dev/null 2>&1; then
            if gh pr merge "$PR_URL" --auto "--$MERGE_METHOD" 2>/dev/null; then
              echo "Queued via native auto-merge ($BASE_REF has required status checks)."
              exit 0
            fi
            echo "Native auto-merge refused despite required checks, polling instead."
          else
            echo "No required status checks on $BASE_REF, so --auto would merge on the spot. Polling instead."
          fi

          # Exclude this workflow's own checks or we would wait on ourselves.
          deadline=$(( SECONDS + TIMEOUT_MINUTES * 60 ))
          api_failures=0
          while :; do
            # NEVER collapse an unreadable API into "no checks". The previous
            # `|| echo '[]'` did exactly that: any gh failure produced total=0,
            # pending=0, and therefore "All 0 non-self check(s) green" -> merge.
            # During the 2026-08-17 GitHub API outage that would have merged
            # every open Dependabot PR on an unknown check state.
            raw=$(gh pr checks "$PR_URL" --json name,bucket,workflow 2>/dev/null) || true
            if printf '%s' "$raw" | jq -e 'type == "array"' >/dev/null 2>&1; then
              api_failures=0
            elif gh pr view "$PR_URL" --json number >/dev/null 2>&1; then
              # The API is reachable, so this genuinely is "no checks reported".
              raw='[]'
              api_failures=0
            else
              api_failures=$(( api_failures + 1 ))
              if [ "$api_failures" -ge "$MAX_API_FAILURES" ]; then
                echo "::error::Could not read this PR's checks $MAX_API_FAILURES times in a row. Refusing to merge on an unknown check state."
                exit 1
              fi
              echo "  check read failed ($api_failures/$MAX_API_FAILURES), retrying."
              sleep 20
              continue
            fi

            others=$(printf '%s' "$raw" | jq -c --arg self "$SELF_WORKFLOW" \
              '[.[] | select(.workflow != $self)]')

            failed=$(printf '%s' "$others" | jq '[.[] | select(.bucket == "fail")] | length')
            pending=$(printf '%s' "$others" | jq '[.[] | select(.bucket == "pending")] | length')
            total=$(printf '%s' "$others" | jq 'length')

            if [ "$failed" -gt 0 ]; then
              printf '%s' "$others" | jq -r \
                '.[] | select(.bucket == "fail") | "  FAILED: \(.workflow) / \(.name)"'
              echo "::error::$failed check(s) failed on this PR. Not merging."
              exit 1
            fi

            if [ "$pending" -eq 0 ]; then
              if [ "$total" -eq 0 ]; then
                echo "::warning::This PR has no non-self checks at all. Merging on the update classifier alone, with no independent verification."
              fi
              echo "All $total non-self check(s) green."
              break
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out after ${TIMEOUT_MINUTES}m with $pending check(s) still pending."
              exit 1
            fi
            echo "  $pending pending, $total total. Waiting."
            sleep 20
          done

          # A merge can still lose a race if another PR landed first. Dependabot
          # rebases on request, which re-triggers this workflow, so bail cleanly.
          for attempt in 1 2 3; do
            if gh pr merge "$PR_URL" "--$MERGE_METHOD" --delete-branch; then
              echo "Merged on attempt $attempt."
              exit 0
            fi
            echo "Merge attempt $attempt failed, retrying."
            sleep 15
          done

          echo "Merge failed 3 times, most likely the base branch moved."
          gh pr comment "$PR_URL" --body "@dependabot rebase"
          echo "Requested a Dependabot rebase; this workflow will re-run after it lands."
