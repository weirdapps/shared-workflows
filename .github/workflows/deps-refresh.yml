name: Reusable Dependency Refresh

# Reusable npm dependency-refresh: npm update -> validate (gate_cmd) -> open a
# PR. Callers set their schedule + gate command and MUST declare write
# permissions (a reusable can't escalate beyond the caller's grant).
# Command inputs run via env vars (bash -c "$VAR"), never interpolated into run.

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node version"
        required: false
        type: string
        default: "lts/*"
      setup_cmd:
        description: "Optional extra setup before refresh"
        required: false
        type: string
        default: ""
      refresh_cmd:
        description: "Lockfile refresh command"
        required: false
        type: string
        default: |
          npm update
          npm install
      gate_cmd:
        description: "Validation command that must pass before a PR opens"
        required: true
        type: string
    secrets:
      PUSH_PAT:
        description: >-
          PAT for opening the PR. Optional only in the sense that the workflow
          still runs without it: the resulting PR will not be mergeable. See the
          warning the refresh job emits.
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Warn loudly when PUSH_PAT is absent. Without it the PR is opened by
      # github.token, which has two consequences and neither is visible on the
      # PR itself:
      #   * where Actions may open PRs, the PR is authored by github-actions[bot],
      #     so every pull_request run parks at action_required with no approval.
      #     statusCheckRollup is empty and the PR sits UNSTABLE forever. It reads
      #     as "no checks yet", not as "misconfigured".
      #   * where Actions may NOT open PRs, the create call is rejected outright
      #     and this job goes red AFTER pushing the branch, leaving a dangling
      #     deps/monthly-refresh with no PR.
      # Both were live on 2026-08-17 across four repos. This does not fail the
      # job, because the lockfile refresh and the gate are still worth running,
      # but it stops the cause being invisible.
      - name: Check PR-opening credential
        env:
          HAS_PAT: ${{ secrets.PUSH_PAT != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::PUSH_PAT is not set. The PR will be opened by github.token, which either parks all of its checks at action_required or is refused outright. Add the PUSH_PAT repo secret."
            {
              echo "### PUSH_PAT missing"
              echo
              echo "This refresh PR will not be mergeable. Its checks will never run."
              echo "Fix: \`gh secret set PUSH_PAT -R <owner>/<repo>\`."
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "PUSH_PAT present."
          fi
      # actions/checkout v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # actions/setup-node v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ inputs.node_version }}
      - if: ${{ inputs.setup_cmd != '' }}
        name: Extra setup
        env:
          SETUP_CMD: ${{ inputs.setup_cmd }}
        run: bash -euo pipefail -c "$SETUP_CMD"
      - name: Refresh dependencies
        env:
          REFRESH_CMD: ${{ inputs.refresh_cmd }}
        run: bash -euo pipefail -c "$REFRESH_CMD"
      - name: Validate
        env:
          GATE_CMD: ${{ inputs.gate_cmd }}
        run: bash -euo pipefail -c "$GATE_CMD"
      # peter-evans/create-pull-request v8.1.1
      - name: Open PR with refreshed lockfile
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.PUSH_PAT || github.token }}
          branch: deps/monthly-refresh
          delete-branch: true
          commit-message: "deps: monthly dependency refresh"
          title: "deps: monthly dependency refresh"
          body: |
            Automated monthly dependency refresh via the shared reusable
            workflow (weirdapps/shared-workflows). Validation passed.
            Review and merge if green.
          labels: dependencies
