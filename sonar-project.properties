# SonarCloud configuration

sonar.organization=weirdapps
sonar.projectKey=weirdapps_shared-workflows
sonar.projectName=shared-workflows

# The repository is reusable GitHub Actions workflows, so the workflows are the
# code. SonarCloud's GitHub Actions rules analyse them; .github is a hidden
# directory, so hidden files must be indexed.
sonar.sources=.github
sonar.scanner.excludeHiddenFiles=false
sonar.sourceEncoding=UTF-8
